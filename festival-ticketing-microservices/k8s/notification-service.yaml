apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: festival-system
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/replace-me/festival-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          env:
            - {name: EUREKA_URL, value: "http://service-discovery:8761/eureka/"}
            - {name: RABBITMQ_HOST, value: rabbitmq}
            - {name: RABBITMQ_USERNAME, value: festival}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: festival-secrets, key: rabbitmq-password}}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: festival-system
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8085
      targetPort: http
  type: ClusterIP
