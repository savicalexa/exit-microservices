apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: festival-system
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ghcr.io/replace-me/festival-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - {name: EUREKA_URL, value: "http://service-discovery:8761/eureka/"}
            - {name: DB_URL, value: "jdbc:mysql://mysql:3306/userdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"}
            - {name: DB_USERNAME, value: festival}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: festival-secrets, key: mysql-password}}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: festival-system
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8083
      targetPort: http
  type: ClusterIP
