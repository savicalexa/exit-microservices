apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: festival-system
  labels:
    app: event-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      initContainers:
        - name: create-festival-database
          image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
          command: ["/bin/bash", "-c"]
          args:
            - >-
              until /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"; do sleep 3; done;
              /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID('festivaldb') IS NULL CREATE DATABASE festivaldb"
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom: {secretKeyRef: {name: festival-secrets, key: mssql-sa-password}}
      containers:
        - name: event-service
          image: ghcr.io/replace-me/festival-event-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - {name: EUREKA_URL, value: "http://service-discovery:8761/eureka/"}
            - {name: DB_URL, value: "jdbc:sqlserver://mssql:1433;databaseName=festivaldb;encrypt=true;trustServerCertificate=true"}
            - {name: DB_USERNAME, value: sa}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: festival-secrets, key: mssql-sa-password}}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
  namespace: festival-system
spec:
  selector:
    app: event-service
  ports:
    - name: http
      port: 8081
      targetPort: http
  type: ClusterIP
