apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: festival-system
  labels:
    app: service-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-discovery
  template:
    metadata:
      labels:
        app: service-discovery
    spec:
      containers:
        - name: service-discovery
          image: ghcr.io/replace-me/festival-service-discovery:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: service-discovery
  namespace: festival-system
spec:
  selector:
    app: service-discovery
  ports:
    - name: http
      port: 8761
      targetPort: http
  type: ClusterIP
