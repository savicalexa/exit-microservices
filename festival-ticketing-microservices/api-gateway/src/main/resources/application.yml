server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/festivals/**
            - id: ticket-service
              uri: lb://ticket-service
              predicates:
                - Path=/api/tickets/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
