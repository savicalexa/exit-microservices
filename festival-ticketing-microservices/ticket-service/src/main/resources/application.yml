server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ticket-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketdb}
    username: ${DB_USERNAME:festival}
    password: ${DB_PASSWORD:festivalpass}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:festival}
    password: ${RABBITMQ_PASSWORD:festivalpass}
    listener.simple:
      acknowledge-mode: auto
      default-requeue-rejected: false
      retry:
        enabled: true
        initial-interval: 1s
        max-attempts: 3
        multiplier: 2

eureka:
  client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance.prefer-ip-address: true

spring.cloud.openfeign.client.config:
  default:
    connectTimeout: 3000
    readTimeout: 5000
    loggerLevel: basic

ticket:
  reservation-ttl: ${RESERVATION_TTL:PT15M}
  reservation-cleanup-ms: ${RESERVATION_CLEANUP_MS:60000}

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
